[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]
gas_reports = ["CacaoTreeNFT", "CacaoToken", "MazorcaRedemption", "TreeAdoption", "IoTAttestation"]

# Network endpoints — RPC URLs from env. Chain IDs match docs/WEB3.md.
[rpc_endpoints]
base         = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base         = { key = "${BASESCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

# CauaCore §10 enforcement — keep contracts deterministic, no console.log in prod.
[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
