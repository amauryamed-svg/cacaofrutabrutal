<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #040C06;
    color: #F7F1EE;
    font-family: 'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 52px 64px;
    background: #040C06;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .canvas::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 720px 520px at 82% 28%, rgba(145, 166, 59, 0.10), transparent 62%),
      radial-gradient(ellipse 540px 360px at 12% 88%, rgba(241, 169, 30, 0.05), transparent 70%);
    pointer-events: none;
  }

  .canvas::after {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.06;
    pointer-events: none;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 240px 240px;
  }

  .eyebrow {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .eyebrow-bar {
    width: 4px;
    height: 22px;
    background: #F1A91E;
  }
  .eyebrow-text {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #F1A91E;
  }

  .hero {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 22px;
    margin-top: 12px;
  }
  .hero-h1 {
    font-family: 'Barlow Condensed', Impact, sans-serif;
    font-weight: 900;
    font-size: 152px;
    line-height: 0.86;
    letter-spacing: -0.025em;
    text-transform: uppercase;
    color: #F7F1EE;
  }
  .hero-h1 .accent {
    color: #91A63B;
  }
  .hero-h1 .line {
    display: block;
  }

  .rule {
    width: 88px;
    height: 3px;
    background: #91A63B;
    margin-top: 6px;
  }

  .tagline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.25;
    color: rgba(247, 241, 238, 0.92);
    max-width: 820px;
    letter-spacing: 0.005em;
  }

  .footer {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 40px;
  }
  .footer-col {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .footer-bar {
    width: 3px;
    height: 18px;
    background: #F1A91E;
  }
  .footer-url {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #F7F1EE;
  }
  .footer-tag {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #F1A91E;
    text-align: right;
  }

  .corner-mark {
    position: absolute;
    top: 52px;
    right: 64px;
    z-index: 2;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(247, 241, 238, 0.4);
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="eyebrow">
    <div class="eyebrow-bar"></div>
    <div class="eyebrow-text">CAUA · Biotecnología del Cacao Colombiano</div>
  </div>

  <div class="corner-mark">EST · 2024 · Huila · Colombia</div>

  <div class="hero">
    <div class="hero-h1">
      <span class="line">CACAO</span>
      <span class="line accent">FRUTA</span>
      <span class="line">BRUTAL</span>
    </div>
    <div class="rule"></div>
    <div class="tagline">Del genoma colombiano al mundo. Fruta. Brutal.</div>
  </div>

  <div class="footer">
    <div class="footer-col">
      <div class="footer-bar"></div>
      <div class="footer-url">cacaofrutabrutal.com</div>
    </div>
    <div class="footer-col">
      <div class="footer-bar"></div>
      <div class="footer-tag">Fine-flavor · Whole Foods 2026</div>
    </div>
  </div>
</div>
</body>
</html>
