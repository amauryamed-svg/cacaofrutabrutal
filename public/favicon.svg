<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background circle gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1C3B26"/>
      <stop offset="100%" stop-color="#040C06"/>
    </radialGradient>

    <!-- Pod body gradient — warm amber to deep chocolate -->
    <linearGradient id="pod" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%"   stop-color="#C8832A"/>
      <stop offset="40%"  stop-color="#A05E18"/>
      <stop offset="100%" stop-color="#5C3008"/>
    </linearGradient>

    <!-- Pod highlight -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F1A91E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F1A91E" stop-opacity="0"/>
    </linearGradient>

    <!-- Leaf gradient -->
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#91A63B"/>
      <stop offset="100%" stop-color="#1C3B26"/>
    </linearGradient>

    <!-- Soft glow behind pod -->
    <radialGradient id="glow" cx="50%" cy="55%" r="45%">
      <stop offset="0%"   stop-color="#F1A91E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F1A91E" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="leafshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>

  <!-- Subtle border ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#91A63B" stroke-width="0.6" stroke-opacity="0.35"/>

  <!-- Golden ambient glow behind pod -->
  <ellipse cx="50" cy="56" rx="26" ry="30" fill="url(#glow)"/>

  <!-- ── CACAO POD ── -->
  <!-- Main pod body — slightly tilted, organic shape -->
  <g filter="url(#shadow)" transform="rotate(-8, 50, 55)">
    <!-- Pod outer shape -->
    <ellipse cx="50" cy="57" rx="18" ry="28" fill="url(#pod)"/>

    <!-- Pod ribs — subtle vertical channels -->
    <ellipse cx="44" cy="57" rx="4.5" ry="27.5" fill="none" stroke="#3D1E06" stroke-width="0.9" stroke-opacity="0.55"/>
    <ellipse cx="50" cy="57" rx="4.5" ry="27.5" fill="none" stroke="#3D1E06" stroke-width="0.9" stroke-opacity="0.55"/>
    <ellipse cx="56" cy="57" rx="4.5" ry="27.5" fill="none" stroke="#3D1E06" stroke-width="0.9" stroke-opacity="0.55"/>

    <!-- Highlight overlay -->
    <ellipse cx="44" cy="48" rx="9" ry="16" fill="url(#shine)"/>

    <!-- Texture dots — small seed bumps -->
    <circle cx="47" cy="52" r="1.1" fill="#F1A91E" fill-opacity="0.18"/>
    <circle cx="53" cy="58" r="1.1" fill="#F1A91E" fill-opacity="0.18"/>
    <circle cx="48" cy="64" r="1.1" fill="#F1A91E" fill-opacity="0.18"/>
    <circle cx="54" cy="47" r="0.9" fill="#F1A91E" fill-opacity="0.15"/>

    <!-- Peduncle / stem nub at top -->
    <ellipse cx="50" cy="29.5" rx="4" ry="3" fill="#7A4E1F"/>
    <rect x="48" y="27" width="4" height="5" rx="2" fill="#5C3008"/>
  </g>

  <!-- ── BOTANICAL LEAF ── -->
  <!-- Two leaves emerging from stem — asymmetric, natural -->
  <g filter="url(#leafshadow)">
    <!-- Left leaf -->
    <path d="M 50 28 C 36 20 28 10 38 8 C 44 6 50 18 50 28 Z"
          fill="url(#leaf)" opacity="0.92"/>
    <!-- Left leaf midrib -->
    <path d="M 50 28 C 44 20 40 13 38 8"
          stroke="#91A63B" stroke-width="0.6" fill="none" stroke-opacity="0.5"/>

    <!-- Right leaf -->
    <path d="M 50 28 C 64 20 72 10 62 8 C 56 6 50 18 50 28 Z"
          fill="url(#leaf)" opacity="0.85"/>
    <!-- Right leaf midrib -->
    <path d="M 50 28 C 56 20 60 13 62 8"
          stroke="#91A63B" stroke-width="0.6" fill="none" stroke-opacity="0.5"/>

    <!-- Lateral leaf veins — left -->
    <path d="M 44 20 C 40 18 38 17 37 16" stroke="#91A63B" stroke-width="0.4" fill="none" stroke-opacity="0.4"/>
    <path d="M 46 23 C 42 22 39 21 37 21" stroke="#91A63B" stroke-width="0.4" fill="none" stroke-opacity="0.35"/>
    <!-- Lateral leaf veins — right -->
    <path d="M 56 20 C 60 18 62 17 63 16" stroke="#91A63B" stroke-width="0.4" fill="none" stroke-opacity="0.4"/>
    <path d="M 54 23 C 58 22 61 21 63 21" stroke="#91A63B" stroke-width="0.4" fill="none" stroke-opacity="0.35"/>
  </g>

  <!-- ── CACAO SEEDS — peeking at base ── -->
  <!-- Small seeds visible at the bottom of the pod -->
  <g transform="rotate(-8, 50, 55)">
    <ellipse cx="46" cy="81" rx="4.5" ry="3" fill="#5C3008" opacity="0.7"/>
    <ellipse cx="54" cy="82" rx="4"   ry="3" fill="#5C3008" opacity="0.65"/>
    <ellipse cx="50" cy="83.5" rx="3.5" ry="2.5" fill="#7A4E1F" opacity="0.6"/>
  </g>

  <!-- ── GRAIN NOISE overlay for depth ── -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
  <circle cx="50" cy="50" r="50" fill="transparent"
    style="filter:url(#grain)" opacity="0.04"/>
</svg>
