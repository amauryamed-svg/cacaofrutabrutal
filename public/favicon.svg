<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C3B26"/>
      <stop offset="100%" stop-color="#040C06"/>
    </radialGradient>
    <radialGradient id="leaf" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#B8D44A"/>
      <stop offset="45%" stop-color="#91A63B"/>
      <stop offset="100%" stop-color="#4A6B1A"/>
    </radialGradient>
    <radialGradient id="leafSheen" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#D4E870" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#91A63B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#040C06" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#91A63B" stroke-width="0.8" opacity="0.4"/>

  <!-- Leaf body — cacao leaf, pointed oval, tilted -->
  <g filter="url(#shadow)">
    <path d="M32 9 C44 11 54 20 53 33 C52 46 42 55 32 57 C22 55 12 46 11 33 C10 20 20 11 32 9Z"
      fill="url(#leaf)" transform="rotate(-12 32 33)"/>
  </g>

  <!-- Sheen -->
  <path d="M32 9 C44 11 54 20 53 33 C52 46 42 55 32 57 C22 55 12 46 11 33 C10 20 20 11 32 9Z"
    fill="url(#leafSheen)" transform="rotate(-12 32 33)"/>

  <!-- Midrib (central vein) -->
  <path d="M30 12 C30 25 30 40 29 55"
    fill="none" stroke="#3A6B18" stroke-width="1.4"
    stroke-linecap="round" opacity="0.8"
    transform="rotate(-12 32 33)"/>

  <!-- Lateral veins — left -->
  <g fill="none" stroke="#3A6B18" stroke-width="0.65" stroke-linecap="round" opacity="0.6">
    <path d="M29.5 19 Q23 21 17 23" transform="rotate(-12 32 33)"/>
    <path d="M29.5 25 Q22 28 15 30" transform="rotate(-12 32 33)"/>
    <path d="M29.5 31 Q22 34 15 37" transform="rotate(-12 32 33)"/>
    <path d="M29.5 37 Q22 40 16 43" transform="rotate(-12 32 33)"/>
    <path d="M29.5 43 Q23 46 18 48" transform="rotate(-12 32 33)"/>
  </g>

  <!-- Lateral veins — right -->
  <g fill="none" stroke="#3A6B18" stroke-width="0.65" stroke-linecap="round" opacity="0.6">
    <path d="M30.5 19 Q37 21 43 23" transform="rotate(-12 32 33)"/>
    <path d="M30.5 25 Q38 28 45 30" transform="rotate(-12 32 33)"/>
    <path d="M30.5 31 Q38 34 45 37" transform="rotate(-12 32 33)"/>
    <path d="M30.5 37 Q37 40 43 43" transform="rotate(-12 32 33)"/>
    <path d="M30.5 43 Q36 46 41 48" transform="rotate(-12 32 33)"/>
  </g>

  <!-- Tip highlight -->
  <ellipse cx="31" cy="14" rx="2.2" ry="3.5"
    fill="#D4E870" opacity="0.3"
    transform="rotate(-12 32 33)"/>

  <!-- Gold accent glow — brand touch (mazorca) -->
  <circle cx="45" cy="19" r="2.2" fill="#F1A91E" opacity="0.8" filter="url(#glow)"/>
</svg>
