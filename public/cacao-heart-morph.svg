<?xml version="1.0" encoding="UTF-8"?>
<!--
  Caúa — Fear-5 criollo cacao pod, beating.
  Pure botanical pod (no human-heart anatomy). The "heartbeat" is the scale
  pulsation + halo throb only — the pod itself is the entire form.
  Filename kept (cacao-heart-morph.svg) for backwards compatibility.

  Fear-5 criollo features:
    · elongated ovoid body, length:width ~1.9:1
    · 5 visible longitudinal ridges (10 wrap the full pod)
    · 4 visible furrows shadowed between ridges
    · rugose / verrugoso surface (~50 warts)
    · scattered lenticels (~22 micro-dots)
    · curved, slightly uplifted apex
    · stalk + calyx remnant at top
    · ripe-criollo palette: oxblood -> rust -> peach with olive undertones

  Heartbeat rhythm (~60 bpm, lub-dub) on a 1.0s loop — scale + halo only.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 240 320"
     role="img"
     aria-label="A Fear-5 criollo cacao pod, beating">

  <defs>
    <!-- ── BODY SHADING — Fear-5 criollo palette, four-layer build ── -->
    <radialGradient id="bodyShadow" cx="68%" cy="58%" r="72%">
      <stop offset="0%"   stop-color="#2A0606"/>
      <stop offset="50%"  stop-color="#3F0A0A"/>
      <stop offset="100%" stop-color="#0F0303"/>
    </radialGradient>
    <radialGradient id="bodyMid" cx="34%" cy="30%" r="78%">
      <stop offset="0%"   stop-color="#C25A2C"/>
      <stop offset="22%"  stop-color="#A4391E"/>
      <stop offset="55%"  stop-color="#6E1E16"/>
      <stop offset="85%"  stop-color="#3A0C0E"/>
      <stop offset="100%" stop-color="#220606" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bodyKey" cx="30%" cy="20%" r="48%">
      <stop offset="0%"   stop-color="#F2A560" stop-opacity="0.88"/>
      <stop offset="40%"  stop-color="#D87038" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#C25A2C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oliveCast" cx="22%" cy="74%" r="40%">
      <!-- criollo green->red maturity undertone in shadowed lower-left -->
      <stop offset="0%"   stop-color="#4A4218" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4A4218" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="podSpec" cx="32%" cy="22%" r="10%">
      <stop offset="0%"   stop-color="#FFE4B5" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#FFD89A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFD89A" stop-opacity="0"/>
    </radialGradient>

    <!-- Ridge crest highlight — painted along each of the 5 visible ridges -->
    <linearGradient id="ridgeHi" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#F2A560" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#F2A560" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#F0884A" stop-opacity="0.42"/>
      <stop offset="85%"  stop-color="#A4391E" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#A4391E" stop-opacity="0"/>
    </linearGradient>

    <!-- Furrow shadow — painted in each valley between ridges -->
    <linearGradient id="furrowShdw" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#1A0404" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#1A0404" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#0F0303" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#0F0303" stop-opacity="0"/>
    </linearGradient>

    <!-- Wart highlight — tiny gradient for the rugose bumps -->
    <radialGradient id="wartHi" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#F2A560" stop-opacity="0.7"/>
      <stop offset="60%"  stop-color="#A4391E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3F0A0A" stop-opacity="0"/>
    </radialGradient>

    <!-- Stalk + calyx remnant -->
    <linearGradient id="stalkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#5A4A1A"/>
      <stop offset="60%"  stop-color="#3A2A10"/>
      <stop offset="100%" stop-color="#220606"/>
    </linearGradient>

    <!-- Halo (warm gold + magenta divine glow) -->
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#F1A91E" stop-opacity="0.50"/>
      <stop offset="55%"  stop-color="#D03050" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#040C06" stop-opacity="0"/>
    </radialGradient>

    <!-- ── FEAR-5 CRIOLLO POD SILHOUETTE ──
         Elongated ovoid (length:width ~1.9:1), pointed apex curved slightly
         to viewer's left, scalloped edge from underlying ridge geometry.    -->
    <path id="podBody"
          d="M 120,108
             C 102,104  82,110  72,128
             C 60,150   54,180  58,212
             C 62,244   76,272  94,290
             C 104,302  112,310 116,316
             L 124,312
             C 134,304  144,292  152,280
             C 168,260  176,234  178,202
             C 180,172  176,142  164,124
             C 152,108  136,104  120,108 Z"/>

    <!-- Clip the surface texture (warts, lenticels, ridges) to the body -->
    <clipPath id="bodyClip">
      <use href="#podBody"/>
    </clipPath>
  </defs>

  <!-- ── HALO — pulses with the heartbeat ── -->
  <ellipse cx="120" cy="200" rx="125" ry="135" fill="url(#haloGrad)">
    <animate attributeName="rx" dur="1s" repeatCount="indefinite"
             values="118;138;126;144;122;118;118"
             keyTimes="0;0.08;0.16;0.30;0.38;0.46;1"
             calcMode="spline"
             keySplines="0.16 1 0.3 1; 0.4 0 0.5 1; 0.16 1 0.3 1; 0.4 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1"/>
    <animate attributeName="ry" dur="1s" repeatCount="indefinite"
             values="128;148;136;154;132;128;128"
             keyTimes="0;0.08;0.16;0.30;0.38;0.46;1"
             calcMode="spline"
             keySplines="0.16 1 0.3 1; 0.4 0 0.5 1; 0.16 1 0.3 1; 0.4 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1"/>
    <animate attributeName="opacity" dur="1s" repeatCount="indefinite"
             values="0.55;0.95;0.7;1.0;0.65;0.55;0.55"
             keyTimes="0;0.08;0.16;0.30;0.38;0.46;1"/>
  </ellipse>

  <!-- ── BEATING ANATOMICAL HEART ── -->
  <g transform-origin="120 200">
    <animateTransform attributeName="transform" type="scale"
             dur="1s" repeatCount="indefinite"
             values="1;1.07;0.97;1;1.10;0.99;1;1"
             keyTimes="0;0.08;0.16;0.22;0.30;0.38;0.46;1"
             calcMode="spline"
             keySplines="0.16 1 0.3 1; 0.4 0 0.5 1; 0.16 1 0.3 1; 0.16 1 0.3 1; 0.4 0 0.5 1; 0.16 1 0.3 1; 0.5 0 0.5 1"/>

    <!-- ── STALK + CALYX REMNANT — top center, criollo signature ── -->
    <path d="M 116,108 C 114,98 116,92 120,90 C 124,92 126,98 124,108 Z"
          fill="url(#stalkGrad)"/>
    <ellipse cx="120" cy="106" rx="9" ry="3" fill="#3A2A10" opacity="0.85"/>
    <ellipse cx="120" cy="105" rx="7" ry="1.6" fill="#5A4A1A" opacity="0.75"/>

    <!-- ── POD BODY — base shading layers ── -->
    <use href="#podBody" fill="url(#bodyShadow)"/>
    <use href="#podBody" fill="url(#bodyMid)"/>
    <use href="#podBody" fill="url(#oliveCast)"/>

    <!-- ── SURFACE DETAIL — clipped to body silhouette ── -->
    <g clip-path="url(#bodyClip)">

      <!-- 4 furrow shadows (between the 5 visible ridges) -->
      <path d="M 93,118 C 89,160  89,210  93,260 C 95,280  98,295  101,308"
            stroke="url(#furrowShdw)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>
      <path d="M 111,116 C 110,160  111,220  111,275 C 111,290  111,302  112,312"
            stroke="url(#furrowShdw)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.80"/>
      <path d="M 129,116 C 130,160  129,220  129,275 C 129,290  129,302  128,312"
            stroke="url(#furrowShdw)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.80"/>
      <path d="M 147,118 C 151,160  151,210  147,260 C 145,280  142,295  139,308"
            stroke="url(#furrowShdw)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>

      <!-- Body key highlight — large peach wash on upper-left -->
      <path d="M 88,114
               C 102,110 116,110 130,114
               C 138,118 142,124 142,132
               C 138,154 124,176 100,188
               C 86,192  76,184  72,172
               C 68,156  72,134  80,120
               C 82,116  84,114  88,114 Z"
            fill="url(#bodyKey)"/>

      <!-- 5 ridge highlights — visible crests of the longitudinal furrows -->
      <path d="M 84,120 C 76,160  74,210  82,260 C 86,280  92,294  100,302"
            stroke="url(#ridgeHi)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>
      <path d="M 102,118 C 98,160  98,215  102,265 C 105,283  108,295  111,306"
            stroke="url(#ridgeHi)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.70"/>
      <path d="M 120,116 C 120,160  120,220  120,275 C 120,290  120,302  120,312"
            stroke="url(#ridgeHi)" stroke-width="6.5" fill="none" stroke-linecap="round" opacity="0.78"/>
      <path d="M 138,118 C 142,160  142,215  138,265 C 135,283  132,295  129,306"
            stroke="url(#ridgeHi)" stroke-width="5.5" fill="none" stroke-linecap="round" opacity="0.55"/>
      <path d="M 156,120 C 164,160  166,210  158,260 C 154,280  148,294  140,302"
            stroke="url(#ridgeHi)" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.40"/>

      <!-- ── WART CLUSTER — Fear-5 criollo "verrugoso" surface (~50) ── -->
      <g opacity="0.78">
        <!-- Top band (y 130-165) -->
        <ellipse cx="85"  cy="138" rx="2.4" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="100" cy="135" rx="2.6" ry="1.8" fill="url(#wartHi)"/>
        <ellipse cx="116" cy="140" rx="2.3" ry="1.6" fill="url(#wartHi)"/>
        <ellipse cx="132" cy="134" rx="2.5" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="148" cy="142" rx="2.4" ry="1.6" fill="url(#wartHi)"/>
        <ellipse cx="78"  cy="158" rx="2.6" ry="1.8" fill="url(#wartHi)"/>
        <ellipse cx="94"  cy="155" rx="2.3" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="110" cy="160" rx="2.5" ry="1.6" fill="url(#wartHi)"/>
        <ellipse cx="126" cy="156" rx="2.4" ry="1.8" fill="url(#wartHi)"/>
        <ellipse cx="142" cy="162" rx="2.6" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="158" cy="158" rx="2.4" ry="1.6" fill="url(#wartHi)"/>

        <!-- Upper-mid band (y 175-205) -->
        <ellipse cx="72"  cy="180" rx="2.6" ry="1.8" fill="url(#wartHi)"/>
        <ellipse cx="88"  cy="178" rx="2.4" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="104" cy="182" rx="2.7" ry="1.9" fill="url(#wartHi)"/>
        <ellipse cx="120" cy="178" rx="2.5" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="136" cy="180" rx="2.6" ry="1.8" fill="url(#wartHi)"/>
        <ellipse cx="152" cy="178" rx="2.4" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="166" cy="180" rx="2.5" ry="1.6" fill="url(#wartHi)"/>
        <ellipse cx="68"  cy="200" rx="2.5" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="84"  cy="202" rx="2.7" ry="1.9" fill="url(#wartHi)"/>
        <ellipse cx="100" cy="198" rx="2.4" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="116" cy="200" rx="2.6" ry="1.8" fill="url(#wartHi)"/>
        <ellipse cx="132" cy="196" rx="2.5" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="148" cy="200" rx="2.7" ry="1.8" fill="url(#wartHi)"/>
        <ellipse cx="164" cy="198" rx="2.4" ry="1.6" fill="url(#wartHi)"/>
        <ellipse cx="176" cy="200" rx="2.3" ry="1.5" fill="url(#wartHi)"/>

        <!-- Lower-mid band (y 218-250) -->
        <ellipse cx="68"  cy="222" rx="2.6" ry="1.8" fill="url(#wartHi)"/>
        <ellipse cx="86"  cy="220" rx="2.4" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="102" cy="224" rx="2.7" ry="1.9" fill="url(#wartHi)"/>
        <ellipse cx="118" cy="220" rx="2.5" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="134" cy="224" rx="2.6" ry="1.8" fill="url(#wartHi)"/>
        <ellipse cx="150" cy="220" rx="2.4" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="166" cy="222" rx="2.5" ry="1.6" fill="url(#wartHi)"/>
        <ellipse cx="178" cy="220" rx="2.2" ry="1.5" fill="url(#wartHi)"/>
        <ellipse cx="76"  cy="245" rx="2.5" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="92"  cy="248" rx="2.7" ry="1.8" fill="url(#wartHi)"/>
        <ellipse cx="108" cy="244" rx="2.4" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="124" cy="248" rx="2.6" ry="1.8" fill="url(#wartHi)"/>
        <ellipse cx="140" cy="244" rx="2.5" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="156" cy="248" rx="2.4" ry="1.6" fill="url(#wartHi)"/>
        <ellipse cx="172" cy="244" rx="2.3" ry="1.5" fill="url(#wartHi)"/>

        <!-- Lower band (y 265-295) — warts shrink toward apex -->
        <ellipse cx="84"  cy="268" rx="2.3" ry="1.6" fill="url(#wartHi)"/>
        <ellipse cx="100" cy="270" rx="2.4" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="116" cy="268" rx="2.2" ry="1.5" fill="url(#wartHi)"/>
        <ellipse cx="132" cy="270" rx="2.5" ry="1.7" fill="url(#wartHi)"/>
        <ellipse cx="148" cy="268" rx="2.3" ry="1.6" fill="url(#wartHi)"/>
        <ellipse cx="162" cy="270" rx="2.1" ry="1.4" fill="url(#wartHi)"/>
        <ellipse cx="96"  cy="288" rx="2.0" ry="1.4" fill="url(#wartHi)"/>
        <ellipse cx="112" cy="290" rx="2.2" ry="1.5" fill="url(#wartHi)"/>
        <ellipse cx="128" cy="288" rx="2.1" ry="1.5" fill="url(#wartHi)"/>
        <ellipse cx="144" cy="290" rx="2.0" ry="1.4" fill="url(#wartHi)"/>
      </g>

      <!-- ── LENTICELS — small dark surface pores (~22) ── -->
      <g fill="#1A0404" opacity="0.62">
        <circle cx="80"  cy="150" r="0.7"/>
        <circle cx="108" cy="148" r="0.6"/>
        <circle cx="138" cy="152" r="0.7"/>
        <circle cx="160" cy="150" r="0.6"/>
        <circle cx="74"  cy="172" r="0.7"/>
        <circle cx="98"  cy="170" r="0.6"/>
        <circle cx="128" cy="172" r="0.7"/>
        <circle cx="156" cy="170" r="0.6"/>
        <circle cx="170" cy="172" r="0.5"/>
        <circle cx="78"  cy="190" r="0.7"/>
        <circle cx="112" cy="188" r="0.6"/>
        <circle cx="144" cy="190" r="0.7"/>
        <circle cx="172" cy="188" r="0.6"/>
        <circle cx="74"  cy="212" r="0.7"/>
        <circle cx="106" cy="210" r="0.6"/>
        <circle cx="138" cy="212" r="0.7"/>
        <circle cx="170" cy="210" r="0.6"/>
        <circle cx="80"  cy="232" r="0.7"/>
        <circle cx="114" cy="234" r="0.6"/>
        <circle cx="146" cy="232" r="0.7"/>
        <circle cx="92"  cy="258" r="0.6"/>
        <circle cx="138" cy="258" r="0.6"/>
      </g>

      <!-- Specular hotspot — single cream-peach point on upper-left ridge -->
      <ellipse cx="90" cy="135" rx="11" ry="7" fill="url(#podSpec)"/>
      <ellipse cx="92" cy="138" rx="4" ry="2.4" fill="#FFE4B5" opacity="0.45"/>
    </g>

    <!-- Apex shadow — pointed-tip darker pool, repositioned to new apex -->
    <ellipse cx="120" cy="316" rx="14" ry="5" fill="#0F0303" opacity="0.7"/>
  </g>

  <!-- ── SPARKLES — tiny gold motes that puff outward on each beat ── -->
  <g>
    <circle cx="120" cy="200" r="2.5" fill="#F1A91E">
      <animate attributeName="cx" dur="1s" repeatCount="indefinite"
               values="120;120;205;120;215;120;120"
               keyTimes="0;0.08;0.18;0.30;0.40;0.46;1"/>
      <animate attributeName="cy" dur="1s" repeatCount="indefinite"
               values="200;200;130;200;118;200;200"
               keyTimes="0;0.08;0.18;0.30;0.40;0.46;1"/>
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite"
               values="0;1;0.6;1;0.4;0;0"
               keyTimes="0;0.08;0.18;0.30;0.40;0.46;1"/>
    </circle>
    <circle cx="120" cy="200" r="2" fill="#F1A91E">
      <animate attributeName="cx" dur="1s" repeatCount="indefinite"
               values="120;120;35;120;22;120;120"
               keyTimes="0;0.08;0.18;0.30;0.40;0.46;1"/>
      <animate attributeName="cy" dur="1s" repeatCount="indefinite"
               values="200;200;130;200;118;200;200"
               keyTimes="0;0.08;0.18;0.30;0.40;0.46;1"/>
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite"
               values="0;1;0.6;1;0.4;0;0"
               keyTimes="0;0.08;0.18;0.30;0.40;0.46;1"/>
    </circle>
    <circle cx="120" cy="200" r="2.5" fill="#F1A91E">
      <animate attributeName="cy" dur="1s" repeatCount="indefinite"
               values="200;200;280;200;305;200;200"
               keyTimes="0;0.08;0.18;0.30;0.40;0.46;1"/>
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite"
               values="0;1;0.6;1;0.4;0;0"
               keyTimes="0;0.08;0.18;0.30;0.40;0.46;1"/>
    </circle>
  </g>
</svg>
