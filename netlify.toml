[build]
command = "npm run build"
publish = "dist"

[build.environment]
VITE_SUPABASE_URL = "https://kjygovuiphbxcdxeduco.supabase.co"
VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqeWdvdnVpcGhieGNkeGVkdWNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2ODA0NzgsImV4cCI6MjA5MTI1NjQ3OH0.WMlfCLVssh6pAos2vGSx_8aEiOTxb8CUQqG6Zx9npqU"

# SPA routing — rewrite all 404s to index.html
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Cache headers
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate, no-cache"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate, no-cache"

[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "public, s-maxage=3600"

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.hs-scripts.com https://cdnjs.cloudflare.com; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https://kjygovuiphbxcdxeduco.supabase.co https://api.cacaofrutabrutal.com https://api.stripe.com https://api.mercadopago.com https://api.resend.com https://api.open-meteo.com https://js.hs-scripts.com; object-src 'none'; base-uri 'self'; form-action 'self'"
